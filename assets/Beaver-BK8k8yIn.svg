<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Beavers Property Ltd">
  <defs>
    <!-- Site gold, top-lit; no near-white stops so it holds up on light backgrounds. -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d27a"/>
      <stop offset="45%" stop-color="#e8ab3c"/>
      <stop offset="100%" stop-color="#c58a1c"/>
    </linearGradient>
    <!-- Deeper gold for the small "PROPERTY LTD" line so it stays legible. -->
    <linearGradient id="gold-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0b84a"/>
      <stop offset="55%" stop-color="#d69a26"/>
      <stop offset="100%" stop-color="#b57d12"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff8dc" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sub-clip">
      <text class="sub" x="510" y="214" textLength="414" lengthAdjust="spacing">PROPERTY LTD</text>
    </clipPath>
    <style>
      .word, .sub { font-family: Georgia, 'Times New Roman', Times, serif; font-weight: 700; }
      .word { font-size: 84px; fill: #0b1430; }
      .sub { font-size: 50px; }
      .cls-1, .cls-9 { fill: #0b1430; }
      .cls-10 { fill: url(#gold); }
      .cls-11 { fill: #f8fbfe; }
      .sub-fill { fill: url(#gold-text); stroke: #8a5e0c; stroke-width: 1.2px; paint-order: stroke; }
      .shine { animation: sweep 5.5s cubic-bezier(.65, 0, .35, 1) 1.2s infinite; transform: translateX(-160px); }
      @keyframes sweep { 0% { transform: translateX(-160px); } 45%, 100% { transform: translateX(520px); } }
      @media (prefers-reduced-motion: reduce) { .shine { animation: none; opacity: 0; } }
    </style>
  </defs>
